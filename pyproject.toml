[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mineye-terranigma"
version = "0.1.0"
description = "Geological modeling and geophysical inversion tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gempy>=2025.2.0",
    "gempy-viewer>=2025.1.2",
    "matplotlib~=3.10.7",
    "numpy~=2.3.4",
    "pandas~=2.3.3",
    "scipy~=1.16.2",
    "rasterio",
    "scikit-image",
    "scikit-learn",
    "geopandas",
    "gempy_probability", # Standard declaration for your local package
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# --- uv Specific Configurations ---
[tool.uv.sources]
# Tell uv exactly where to find the local package
gempy_probability = { path = "../gempy_probability", editable = true }

# --- Build & Tool Configurations ---
[tool.setuptools.packages.find]
where = ["."]
include = ["mineye*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "examples"]
addopts = "-v --tb=short"
console_output_style = "progress"
